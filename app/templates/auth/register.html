{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-shell"><div class="auth-intro"><p class="eyebrow">FIELD ACCESS</p><h1>Build a clearer inspection trail.</h1><p>Create a workspace for image evidence and grievances.</p></div><form class="form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Create account</h2><label>Full name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Confirm password<input type="password" name="confirmation" minlength="8" required></label><button class="button full" type="submit">Create account</button><p class="form-note form-note-inline"><a href="{{ url_for('auth.login') }}">Sign in</a></p></form></div>{% endblock %}
