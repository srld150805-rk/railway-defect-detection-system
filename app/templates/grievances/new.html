{% extends 'base.html' %}{% block title %}New grievance{% endblock %}{% block content %}<div class="shell page-head"><div><p class="eyebrow">NEW GRIEVANCE</p><h1>Make the concern visible.</h1><p>Give the reviewing team enough context to understand and route your issue.</p></div></div><form class="shell form-panel wide" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Subject<input name="subject" required></label><div class="form-row"><label>Category<select name="category"><option>TRACK CONDITION</option><option>SAFETY</option><option>INFRASTRUCTURE</option><option>INSPECTION</option><option>TECHNICAL ISSUE</option><option>OTHER</option></select></label><label>Priority<select name="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option></select></label></div><label>Description<textarea name="description" rows="7" required></textarea><button class="button" type="submit">Submit grievance <span>↗</span></button></form>{% endblock %}
